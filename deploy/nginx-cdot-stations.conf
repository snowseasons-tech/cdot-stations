# nginx site for the CDOT stations app: forwards LAN port 8080 to the container on 127.0.0.1:3000.
# Plain HTTP, intended for a trusted home network. Installed by scripts/install-nginx-site.sh.
# Who is the visitor? Requests that arrive through the Cloudflare Tunnel come from cloudflared on this machine
# (127.0.0.1), with the real visitor in CF-Connecting-IP. Use that header ONLY when the connection itself is from
# 127.0.0.1; from anywhere else (the LAN) it is ignored, so nobody can spoof their address by sending it.
map "$remote_addr|$http_cf_connecting_ip" $real_client_ip {
    default $remote_addr;
    "~^127\.0\.0\.1\|(?<visitor>.+)$" $visitor;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # The import endpoint accepts up to 500 KB of JSON.
    client_max_body_size 1m;

    # nginx's default only compresses HTML; the API, script and stylesheet are the bulk of what is sent
    # (the map data is ~106 KB raw, ~15 KB compressed). Small responses aren't worth the CPU.
    gzip on;
    gzip_types application/json text/javascript text/css;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
