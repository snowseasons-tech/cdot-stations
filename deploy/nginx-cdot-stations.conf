# nginx site for the CDOT stations app: forwards LAN port 8080 to the container on 127.0.0.1:3000.
# Plain HTTP, intended for a trusted home network. Installed by scripts/install-nginx-site.sh.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # The import endpoint accepts up to 500 KB of JSON.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
