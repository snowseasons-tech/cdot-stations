name: Backup heartbeat check

# The server's backup job commits heartbeat.txt after every successful run. If that stops (server off, cron
# dead, backup failing silently), open an issue so GitHub emails the repo owner.
on:
  schedule:
    - cron: '0 12 * * *' # daily 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/check-heartbeat.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
