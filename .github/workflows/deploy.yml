name: Test and publish image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      # Build once locally and boot it before anything is pushed, so a broken image never reaches the registry.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cdot-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash scripts/smoke-test-image.sh cdot-smoke:ci
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on the server itself via a self-hosted runner (scripts/setup-runner.sh).
  # Skipped until the DEPLOY_ENABLED repository variable is 'true' (see README, "Deploy to your server").
  deploy:
    needs: publish
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, cdot-stations]
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Write app config
        env:
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          [ -n "$STATUS_TOKEN" ] || { echo "::error::STATUS_TOKEN secret is not set"; exit 1; }
          # Push notifications need all three VAPID values, or none (then they are simply off).
          set_count=0
          for v in "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" "$VAPID_SUBJECT"; do [ -n "$v" ] && set_count=$((set_count + 1)); done
          if [ "$set_count" -ne 0 ] && [ "$set_count" -ne 3 ]; then
            echo "::error::Push is partly configured: set all of the VAPID_PUBLIC_KEY and VAPID_SUBJECT variables and the VAPID_PRIVATE_KEY secret, or none"
            exit 1
          fi
          umask 077
          mkdir -p ~/cdot-stations
          {
            printf 'STATUS_TOKEN=%s\n' "$STATUS_TOKEN"
            if [ "$set_count" -eq 3 ]; then
              printf 'VAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\nVAPID_SUBJECT=%s\n' "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" "$VAPID_SUBJECT"
            fi
          } > ~/cdot-stations/env

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GHCR_TOKEN"

      - name: Deploy
        env:
          PORT_MAPPING: ${{ vars.DEPLOY_PORT_MAPPING || '127.0.0.1:3000:3000' }}
        run: bash scripts/deploy.sh "ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}" "$PORT_MAPPING"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
