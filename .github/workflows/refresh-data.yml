name: Refresh data

# Weekly: re-fetch CDOT's port locations and FMCSA's inspection data. If anything changed, commit it to main
# and trigger the normal test -> publish -> deploy pipeline (a push made with GITHUB_TOKEN doesn't trigger
# other workflows on its own, so it's dispatched explicitly).
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The scripts refuse to overwrite on an empty result, dropped stations, or >20% fewer inspections.
      - run: npm run sync
      - run: npm run sync:inspections
      - run: npm run sync:locations
      - run: npm test

      - name: Commit and deploy if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/; then
            echo "Data unchanged; nothing to deploy." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { echo '### Data changed'; echo '```'; git diff --stat -- data/; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stations.json data/inspections.json data/inspection-locations.json
          git commit -m "Refresh station and inspection data ($(date -u +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
